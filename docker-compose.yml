services:
  fdb-coord-1:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-coord-1
    environment:
      FDB_PORT: 4500
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "4500:4500"
    volumes:
      - fdb-coord-1-data:/var/fdb/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        exec /usr/bin/tini -g -- /var/fdb/scripts/fdb.bash

  fdb-coord-2:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-coord-2
    environment:
      FDB_PORT: 4501
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "4501:4501"
    volumes:
      - fdb-coord-2-data:/var/fdb/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        exec /usr/bin/tini -g -- /var/fdb/scripts/fdb.bash

  fdb-coord-3:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-coord-3
    environment:
      FDB_PORT: 4502
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "4502:4502"
    volumes:
      - fdb-coord-3-data:/var/fdb/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        exec /usr/bin/tini -g -- /var/fdb/scripts/fdb.bash

  fdb-server-1:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-server-1
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
    environment:
      FDB_PORT: 4510
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "4510:4510"
    volumes:
      - fdb-server-1-data:/var/fdb/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        exec /usr/bin/tini -g -- /var/fdb/scripts/fdb.bash

  fdb-server-2:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-server-2
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
    environment:
      FDB_PORT: 4511
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "4511:4511"
    volumes:
      - fdb-server-2-data:/var/fdb/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        exec /usr/bin/tini -g -- /var/fdb/scripts/fdb.bash

  fdb-config:
    image: foundationdb/foundationdb:7.3.75
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
      - fdb-server-1
      - fdb-server-2
    environment:
      FDB_PORT: 4500
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        mkdir -p /var/fdb
        echo "docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502" > /var/fdb/fdb.cluster
        
        echo "Waiting for FDB cluster..."
        for i in $$(seq 1 60); do
          if fdbcli --exec "status" 2>/dev/null | grep -q "processes"; then
            echo "Cluster is ready!"
            break
          fi
          sleep 2
        done
        
        echo "Configuring FDB cluster..."
        fdbcli --exec "configure new double ssd" || echo "Already configured"
        fdbcli --exec "status"
        exec tail -f /dev/null

  php:
    build:
      context: ./docker/php
    depends_on:
      - fdb-config
    volumes:
      - .:/app
    environment:
      FDB_CLUSTER_FILE: /app/fdb.cluster
    working_dir: /app
    stdin_open: true
    tty: true
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502" > /app/fdb.cluster
        exec tail -f /dev/null

volumes:
  fdb-coord-1-data:
  fdb-coord-2-data:
  fdb-coord-3-data:
  fdb-server-1-data:
  fdb-server-2-data:
