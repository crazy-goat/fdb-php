# RebootWorkerTest asks a storage process to suspend, then exit, on purpose.
# The five FDB services restart automatically so that a rebooted worker comes
# back and repeated test runs find a healthy cluster. `docker compose down`
# still stops them, because the containers are stopped explicitly.
#
# Shared pieces of the five FDB services. The coordinator string appears only
# once in this file (x-fdb-cluster-file); every service reads the same value.
x-fdb-image: &fdb-image foundationdb/foundationdb:7.3.75
x-fdb-cluster-file: &fdb-cluster-file |
  docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
x-fdb-environment: &fdb-environment
  FDB_BG_URL: "${FDB_BG_URL:-file:///var/fdb/blobs/}"
  FDB_CLUSTER_FILE_CONTENTS: *fdb-cluster-file
x-fdb-entrypoint: &fdb-entrypoint ["/usr/bin/tini", "-g", "--", "/bin/bash", "/usr/local/bin/start-fdb.sh"]
x-fdb-restart: &fdb-restart unless-stopped
x-fdb-healthcheck: &fdb-healthcheck
  test: ["CMD-SHELL", "! grep -q 'Error=\"backup_invalid_url\"' /var/fdb/logs/*.xml 2>/dev/null"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 30s
x-fdb-blobs-volume: &fdb-blobs-volume fdb-blobs:/var/fdb/blobs
x-fdb-start-script-volume: &fdb-start-script-volume ./docker/fdb/start-fdb.sh:/usr/local/bin/start-fdb.sh:ro

services:
  fdb-coord-1:
    image: *fdb-image
    hostname: fdb-coord-1
    environment:
      <<: *fdb-environment
      FDB_PORT: 4500
    ports:
      - "${FDB_COORD_1_PORT:-4500}:4500"
    volumes:
      - fdb-coord-1-data:/var/fdb/data
      - *fdb-blobs-volume
      - *fdb-start-script-volume
    entrypoint: *fdb-entrypoint
    restart: *fdb-restart
    healthcheck: *fdb-healthcheck

  fdb-coord-2:
    image: *fdb-image
    hostname: fdb-coord-2
    environment:
      <<: *fdb-environment
      FDB_PORT: 4501
    ports:
      - "${FDB_COORD_2_PORT:-4501}:4501"
    volumes:
      - fdb-coord-2-data:/var/fdb/data
      - *fdb-blobs-volume
      - *fdb-start-script-volume
    entrypoint: *fdb-entrypoint
    restart: *fdb-restart
    healthcheck: *fdb-healthcheck

  fdb-coord-3:
    image: *fdb-image
    hostname: fdb-coord-3
    environment:
      <<: *fdb-environment
      FDB_PORT: 4502
    ports:
      - "${FDB_COORD_3_PORT:-4502}:4502"
    volumes:
      - fdb-coord-3-data:/var/fdb/data
      - *fdb-blobs-volume
      - *fdb-start-script-volume
    entrypoint: *fdb-entrypoint
    restart: *fdb-restart
    healthcheck: *fdb-healthcheck

  fdb-server-1:
    image: *fdb-image
    hostname: fdb-server-1
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
    environment:
      <<: *fdb-environment
      FDB_PORT: 4510
    ports:
      - "${FDB_SERVER_1_PORT:-4510}:4510"
    volumes:
      - fdb-server-1-data:/var/fdb/data
      - *fdb-blobs-volume
      - *fdb-start-script-volume
    entrypoint: *fdb-entrypoint
    restart: *fdb-restart
    healthcheck: *fdb-healthcheck

  fdb-server-2:
    image: *fdb-image
    hostname: fdb-server-2
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
    environment:
      <<: *fdb-environment
      FDB_PORT: 4511
    ports:
      - "${FDB_SERVER_2_PORT:-4511}:4511"
    volumes:
      - fdb-server-2-data:/var/fdb/data
      - *fdb-blobs-volume
      - *fdb-start-script-volume
    entrypoint: *fdb-entrypoint
    restart: *fdb-restart
    healthcheck: *fdb-healthcheck

  fdb-config:
    image: *fdb-image
    init: true
    depends_on:
      fdb-coord-1:
        condition: service_healthy
      fdb-coord-2:
        condition: service_healthy
      fdb-coord-3:
        condition: service_healthy
      fdb-server-1:
        condition: service_healthy
      fdb-server-2:
        condition: service_healthy
    environment:
      FDB_PORT: 4500
      FDB_CLUSTER_FILE_CONTENTS: *fdb-cluster-file
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        mkdir -p /var/fdb
        # The healthcheck requires this sentinel, so php only starts after the
        # tenant-mode loop below has succeeded. Remove it on every start.
        rm -f /var/fdb/tenant-mode-configured
        printf '%s' "$$FDB_CLUSTER_FILE_CONTENTS" > /var/fdb/fdb.cluster

        echo "Configuring FDB cluster..."
        # A fresh cluster cannot report "The database is available" before it
        # has been configured, so create it first. Retry until enough processes
        # have joined; an existing cluster is reconfigured instead.
        configured=0
        start=$$(date +%s)
        while [ "$$configured" -ne 1 ]; do
          if out=$$(fdbcli --exec "configure new double ssd blob_granules_enabled=1" 2>&1); then
            echo "$$out"
            configured=1
          else
            echo "$$out"
            if echo "$$out" | grep -q "Database already exists"; then
              if out=$$(fdbcli --exec "configure blob_granules_enabled=1" 2>&1); then
                echo "$$out"
                configured=1
              else
                echo "$$out"
              fi
            fi
          fi
          if [ "$$configured" -ne 1 ]; then
            now=$$(date +%s)
            if [ $$((now - start)) -ge 120 ]; then
              echo "Could not configure FDB cluster within 120s" >&2
              exit 1
            fi
            sleep 2
          fi
        done
        echo "Cluster is configured!"

        echo "Waiting for FDB cluster..."
        ready=0
        start=$$(date +%s)
        while [ "$$ready" -ne 1 ]; do
          # "unavailable" contains "available", so match the whole sentence.
          # timeout keeps a blocking status call from stretching the 120 s bound.
          if timeout 5 fdbcli --exec "status minimal" 2>/dev/null | grep -q "The database is available"; then
            ready=1
          else
            now=$$(date +%s)
            if [ $$((now - start)) -ge 120 ]; then
              echo "FDB cluster did not become available within 120s" >&2
              exit 1
            fi
            sleep 2
          fi
        done
        echo "Cluster is ready!"

        echo "Configuring tenant mode..."
        # The cluster can report "available" before every process has joined, and
        # configure then fails with "Not enough processes exist", so retry it.
        tenant_mode=0
        start=$$(date +%s)
        while [ "$$tenant_mode" -ne 1 ]; do
          out=$$(fdbcli --exec "configure tenant_mode=optional_experimental" 2>&1) || true
          echo "$$out"
          if echo "$$out" | grep -q "Configuration changed"; then
            tenant_mode=1
          else
            now=$$(date +%s)
            if [ $$((now - start)) -ge 120 ]; then
              echo "Could not configure tenant mode within 120s" >&2
              exit 1
            fi
            sleep 2
          fi
        done
        echo "Tenant mode configured"
        touch /var/fdb/tenant-mode-configured

        fdbcli --exec "status"
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/fdb/tenant-mode-configured && timeout 4 fdbcli --exec 'status minimal' 2>/dev/null | grep -q 'The database is available'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  php:
    build:
      context: ./docker/php
    # Run as the host user so files written into the bind-mounted worktree are
    # not root-owned. Users whose UID/GID is not 1000 export HOST_UID/HOST_GID
    # (bin/worktree.sh writes them to .env.worktree).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      fdb-config:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      FDB_CLUSTER_FILE: /app/fdb.cluster
      FDB_CLUSTER_FILE_CONTENTS: *fdb-cluster-file
      # The image has no home directory for the host user; Composer needs one.
      HOME: /tmp
    working_dir: /app
    stdin_open: true
    tty: true
    entrypoint:
      - /bin/bash
      - -c
      - |
        printf '%s' "$$FDB_CLUSTER_FILE_CONTENTS" > /app/fdb.cluster
        exec tail -f /dev/null

volumes:
  fdb-coord-1-data:
  fdb-coord-2-data:
  fdb-coord-3-data:
  fdb-server-1-data:
  fdb-server-2-data:
  fdb-blobs:
