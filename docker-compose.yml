# RebootWorkerTest asks a storage process to suspend, then exit, on purpose.
# The five FDB services restart automatically so that a rebooted worker comes
# back and repeated test runs find a healthy cluster. `docker compose down`
# still stops them, because the containers are stopped explicitly.
services:
  fdb-coord-1:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-coord-1
    environment:
      FDB_PORT: 4500
      FDB_BG_URL: "${FDB_BG_URL:-file:///var/fdb/blobs/}"
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "${FDB_COORD_1_PORT:-4500}:4500"
    volumes:
      - fdb-coord-1-data:/var/fdb/data
      - fdb-blobs:/var/fdb/blobs
      - ./docker/fdb/start-fdb.sh:/usr/local/bin/start-fdb.sh:ro
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/usr/local/bin/start-fdb.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "! grep -q 'Error=\"backup_invalid_url\"' /var/fdb/logs/*.xml 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  fdb-coord-2:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-coord-2
    environment:
      FDB_PORT: 4501
      FDB_BG_URL: "${FDB_BG_URL:-file:///var/fdb/blobs/}"
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "${FDB_COORD_2_PORT:-4501}:4501"
    volumes:
      - fdb-coord-2-data:/var/fdb/data
      - fdb-blobs:/var/fdb/blobs
      - ./docker/fdb/start-fdb.sh:/usr/local/bin/start-fdb.sh:ro
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/usr/local/bin/start-fdb.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "! grep -q 'Error=\"backup_invalid_url\"' /var/fdb/logs/*.xml 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  fdb-coord-3:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-coord-3
    environment:
      FDB_PORT: 4502
      FDB_BG_URL: "${FDB_BG_URL:-file:///var/fdb/blobs/}"
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "${FDB_COORD_3_PORT:-4502}:4502"
    volumes:
      - fdb-coord-3-data:/var/fdb/data
      - fdb-blobs:/var/fdb/blobs
      - ./docker/fdb/start-fdb.sh:/usr/local/bin/start-fdb.sh:ro
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/usr/local/bin/start-fdb.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "! grep -q 'Error=\"backup_invalid_url\"' /var/fdb/logs/*.xml 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  fdb-server-1:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-server-1
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
    environment:
      FDB_PORT: 4510
      FDB_BG_URL: "${FDB_BG_URL:-file:///var/fdb/blobs/}"
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "${FDB_SERVER_1_PORT:-4510}:4510"
    volumes:
      - fdb-server-1-data:/var/fdb/data
      - fdb-blobs:/var/fdb/blobs
      - ./docker/fdb/start-fdb.sh:/usr/local/bin/start-fdb.sh:ro
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/usr/local/bin/start-fdb.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "! grep -q 'Error=\"backup_invalid_url\"' /var/fdb/logs/*.xml 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  fdb-server-2:
    image: foundationdb/foundationdb:7.3.75
    hostname: fdb-server-2
    depends_on:
      - fdb-coord-1
      - fdb-coord-2
      - fdb-coord-3
    environment:
      FDB_PORT: 4511
      FDB_BG_URL: "${FDB_BG_URL:-file:///var/fdb/blobs/}"
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    ports:
      - "${FDB_SERVER_2_PORT:-4511}:4511"
    volumes:
      - fdb-server-2-data:/var/fdb/data
      - fdb-blobs:/var/fdb/blobs
      - ./docker/fdb/start-fdb.sh:/usr/local/bin/start-fdb.sh:ro
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/usr/local/bin/start-fdb.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "! grep -q 'Error=\"backup_invalid_url\"' /var/fdb/logs/*.xml 2>/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  fdb-config:
    image: foundationdb/foundationdb:7.3.75
    init: true
    depends_on:
      fdb-coord-1:
        condition: service_healthy
      fdb-coord-2:
        condition: service_healthy
      fdb-coord-3:
        condition: service_healthy
      fdb-server-1:
        condition: service_healthy
      fdb-server-2:
        condition: service_healthy
    environment:
      FDB_PORT: 4500
      FDB_CLUSTER_FILE_CONTENTS: |
        docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -rf /var/fdb/logs/* 2>/dev/null || true
        mkdir -p /var/fdb
        # The healthcheck requires this sentinel, so php only starts after the
        # tenant-mode loop below has succeeded. Remove it on every start.
        rm -f /var/fdb/tenant-mode-configured
        echo "docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502" > /var/fdb/fdb.cluster

        echo "Configuring FDB cluster..."
        # A fresh cluster cannot report "The database is available" before it
        # has been configured, so create it first. Retry until enough processes
        # have joined; an existing cluster is reconfigured instead.
        configured=0
        start=$$(date +%s)
        while [ "$$configured" -ne 1 ]; do
          if out=$$(fdbcli --exec "configure new double ssd blob_granules_enabled=1" 2>&1); then
            echo "$$out"
            configured=1
          else
            echo "$$out"
            if echo "$$out" | grep -q "Database already exists"; then
              if out=$$(fdbcli --exec "configure blob_granules_enabled=1" 2>&1); then
                echo "$$out"
                configured=1
              else
                echo "$$out"
              fi
            fi
          fi
          if [ "$$configured" -ne 1 ]; then
            now=$$(date +%s)
            if [ $$((now - start)) -ge 120 ]; then
              echo "Could not configure FDB cluster within 120s" >&2
              exit 1
            fi
            sleep 2
          fi
        done
        echo "Cluster is configured!"

        echo "Waiting for FDB cluster..."
        ready=0
        start=$$(date +%s)
        while [ "$$ready" -ne 1 ]; do
          # "unavailable" contains "available", so match the whole sentence.
          # timeout keeps a blocking status call from stretching the 120 s bound.
          if timeout 5 fdbcli --exec "status minimal" 2>/dev/null | grep -q "The database is available"; then
            ready=1
          else
            now=$$(date +%s)
            if [ $$((now - start)) -ge 120 ]; then
              echo "FDB cluster did not become available within 120s" >&2
              exit 1
            fi
            sleep 2
          fi
        done
        echo "Cluster is ready!"

        echo "Configuring tenant mode..."
        # The cluster can report "available" before every process has joined, and
        # configure then fails with "Not enough processes exist", so retry it.
        tenant_mode=0
        start=$$(date +%s)
        while [ "$$tenant_mode" -ne 1 ]; do
          out=$$(fdbcli --exec "configure tenant_mode=optional_experimental" 2>&1) || true
          echo "$$out"
          if echo "$$out" | grep -q "Configuration changed"; then
            tenant_mode=1
          else
            now=$$(date +%s)
            if [ $$((now - start)) -ge 120 ]; then
              echo "Could not configure tenant mode within 120s" >&2
              exit 1
            fi
            sleep 2
          fi
        done
        echo "Tenant mode configured"
        touch /var/fdb/tenant-mode-configured

        fdbcli --exec "status"
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/fdb/tenant-mode-configured && timeout 4 fdbcli --exec 'status minimal' 2>/dev/null | grep -q 'The database is available'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  php:
    build:
      context: ./docker/php
    depends_on:
      fdb-config:
        condition: service_healthy
    volumes:
      - .:/app
      - fdb-blobs:/var/fdb/blobs
    environment:
      FDB_CLUSTER_FILE: /app/fdb.cluster
    working_dir: /app
    stdin_open: true
    tty: true
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "docker:docker@fdb-coord-1:4500,fdb-coord-2:4501,fdb-coord-3:4502" > /app/fdb.cluster
        exec tail -f /dev/null

volumes:
  fdb-coord-1-data:
  fdb-coord-2-data:
  fdb-coord-3-data:
  fdb-server-1-data:
  fdb-server-2-data:
  fdb-blobs:
