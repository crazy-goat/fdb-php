name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The required status check is `ci-ok`. Fork pull requests need a maintainer's approval to run
# workflows (repository setting), so no actor check is needed here.
jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # No test reads Markdown files, so documentation-only changes skip the heavy jobs.
      docs-regex: '^(.*\.md|docs/.*|LICENSE.*|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md|\.gitignore)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ffi, gmp
          coverage: none

      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install lint tools
        run: |
          set -euo pipefail
          . .lint-tools.env
          mkdir -p "$HOME/.local/bin"

          shellcheck_tmp=$(mktemp)
          curl -sSfL -o "$shellcheck_tmp" \
            "https://github.com/koalaman/shellcheck/releases/download/v${LINT_SHELLCHECK_VERSION}/shellcheck-v${LINT_SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$LINT_SHELLCHECK_SHA256" "$shellcheck_tmp" | sha256sum -c -
          tar -xJ --strip-components=1 -C "$HOME/.local/bin" -f "$shellcheck_tmp" \
            "shellcheck-v${LINT_SHELLCHECK_VERSION}/shellcheck"
          rm -f "$shellcheck_tmp"

          hadolint_tmp=$(mktemp)
          curl -sSfL -o "$hadolint_tmp" \
            "https://github.com/hadolint/hadolint/releases/download/v${LINT_HADOLINT_VERSION}/hadolint-Linux-x86_64"
          printf '%s  %s\n' "$LINT_HADOLINT_SHA256" "$hadolint_tmp" | sha256sum -c -
          install -m 0755 "$hadolint_tmp" "$HOME/.local/bin/hadolint"
          rm -f "$hadolint_tmp"

          actionlint_tmp=$(mktemp)
          curl -sSfL -o "$actionlint_tmp" \
            "https://github.com/rhysd/actionlint/releases/download/v${LINT_ACTIONLINT_VERSION}/actionlint_${LINT_ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$LINT_ACTIONLINT_SHA256" "$actionlint_tmp" | sha256sum -c -
          tar -xz -C "$HOME/.local/bin" -f "$actionlint_tmp" actionlint
          rm -f "$actionlint_tmp"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check lint tool versions
        run: |
          set -euo pipefail
          . .lint-tools.env
          shellcheck --version | grep -F "version: ${LINT_SHELLCHECK_VERSION}" >/dev/null
          hadolint --version | grep -F " ${LINT_HADOLINT_VERSION}" >/dev/null
          actionlint --version | grep -xF "${LINT_ACTIONLINT_VERSION}" >/dev/null

      - name: Lint
        run: bin/lint.sh

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, gmp
          coverage: none

      # The library-path unit test skips without a real libfdb_c, so install the
      # client in every matrix entry: the native FFI binding must be exercised
      # on the declared minimum (PHP 8.2), not only on the newest version.
      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite=Unit --testdox

  e2e-tests:
    name: E2E Tests (5-node FDB cluster)
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start 5-node FDB cluster
        run: |
          docker-compose up -d fdb-coord-1 fdb-coord-2 fdb-coord-3 fdb-server-1 fdb-server-2 fdb-config
          
          # Wait for cluster to be ready
          echo "Waiting for FDB cluster..."
          start=$SECONDS
          # "unavailable" contains "available", so match the whole sentence.
          until docker-compose exec -T fdb-config fdbcli --exec "status minimal" 2>/dev/null | grep -q "The database is available"; do
            if (( SECONDS - start >= 120 )); then
              echo "FDB cluster did not become available within 120s" >&2
              exit 1
            fi
            sleep 2
          done
          echo "FDB cluster is available after $((SECONDS - start))s"

          # Show cluster status
          docker-compose exec -T fdb-config fdbcli --exec "status"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ffi, gmp
          coverage: none
          ini-values: ffi.enable=true

      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create cluster file
        run: |
          echo "docker:docker@127.0.0.1:4500,127.0.0.1:4501,127.0.0.1:4502" > fdb.cluster
          
          # Get IP of fdb-server-1 for reboot tests
          # Container name may vary, so we use docker-compose to find it
          SERVER1_CONTAINER=$(docker-compose ps -q fdb-server-1)
          if [ -n "$SERVER1_CONTAINER" ]; then
            SERVER1_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$SERVER1_CONTAINER")
            echo "FDB_REBOOT_TEST_IP=${SERVER1_IP}:4510" >> "$GITHUB_ENV"
            echo "fdb-server-1 IP: ${SERVER1_IP}:4510"
          else
            echo "Warning: Could not find fdb-server-1 container"
            echo "FDB_REBOOT_TEST_IP=172.18.0.5:4510" >> "$GITHUB_ENV"
          fi

      - name: Configure tenant mode
        run: |
          # The cluster can report "available" before every process has joined, and
          # configure then fails with "Not enough processes exist", so retry it.
          start=$SECONDS
          until out=$(docker-compose exec -T fdb-config fdbcli --exec "configure tenant_mode=optional_experimental" 2>&1) \
            && grep -q "Configuration changed" <<< "$out"; do
            echo "$out"
            if (( SECONDS - start >= 120 )); then
              echo "Could not configure tenant mode within 120s" >&2
              exit 1
            fi
            sleep 2
          done
          echo "Tenant mode configured after $((SECONDS - start))s"

      - name: Run E2E tests
        env:
          FDB_CLUSTER_FILE: fdb.cluster
          FDB_REBOOT_TEST_IP: ${{ env.FDB_REBOOT_TEST_IP }}
        run: ./vendor/bin/phpunit --testsuite=Integration --testdox

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, unit-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          # A job skipped for any other reason is not a pass for code changes.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
