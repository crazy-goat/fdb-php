name: CI

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: ["master"]

jobs:
  check-actor:
    name: Check actor permissions
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check if actor is owner or collaborator
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;

            if (actor === owner) {
              core.setOutput('allowed', 'true');
              return;
            }

            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              const level = data.permission;
              const allowed = ['admin', 'maintain', 'write'].includes(level);
              core.setOutput('allowed', allowed ? 'true' : 'false');
              if (!allowed) {
                core.warning(`Actor "${actor}" has permission "${level}" — skipping CI.`);
              }
            } catch (e) {
              core.setOutput('allowed', 'false');
              core.warning(`Could not determine permissions for "${actor}": ${e.message}`);
            }

  lint:
    name: Lint (PHPCS + Rector + PHPStan)
    needs: check-actor
    if: needs.check-actor.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ffi, gmp
          coverage: none

      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer cs

      - name: Run Rector (dry-run)
        run: composer rector

      - name: Run PHPStan
        run: composer phpstan

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    needs: [check-actor, lint]
    if: needs.check-actor.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, gmp
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite=Unit --testdox

  e2e-tests:
    name: E2E Tests (5-node FDB cluster)
    needs: [check-actor, lint]
    if: needs.check-actor.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start 5-node FDB cluster
        run: |
          docker-compose up -d fdb-coord-1 fdb-coord-2 fdb-coord-3 fdb-server-1 fdb-server-2 fdb-config
          
          # Wait for cluster to be ready
          echo "Waiting for FDB cluster..."
          for i in $(seq 1 60); do
            if docker-compose exec -T fdb-config fdbcli --exec "status minimal" 2>/dev/null | grep -q "available"; then
              echo "FDB cluster is ready after ${i}s"
              break
            fi
            sleep 2
          done
          
          # Show cluster status
          docker-compose exec -T fdb-config fdbcli --exec "status"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ffi, gmp
          coverage: none
          ini-values: ffi.enable=true

      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create cluster file
        run: |
          echo "docker:docker@127.0.0.1:4500,127.0.0.1:4501,127.0.0.1:4502" > fdb.cluster
          
          # Get IP of fdb-server-1 for reboot tests
          SERVER1_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fdb-php-fdb-server-1-1)
          echo "FDB_REBOOT_TEST_IP=${SERVER1_IP}:4510" >> $GITHUB_ENV
          echo "fdb-server-1 IP: ${SERVER1_IP}:4510"

      - name: Configure tenant mode
        run: |
          docker-compose exec -T fdb-config fdbcli --exec "configure tenant_mode=optional_experimental"

      - name: Run E2E tests
        env:
          FDB_CLUSTER_FILE: fdb.cluster
          FDB_REBOOT_TEST_IP: ${{ env.FDB_REBOOT_TEST_IP }}
        run: ./vendor/bin/phpunit --testsuite=Integration --testdox

      - name: Cleanup
        if: always()
        run: docker-compose down -v
