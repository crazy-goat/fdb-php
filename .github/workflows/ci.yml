name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  check-actor:
    name: Check actor permissions
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check if actor is owner or collaborator
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;

            if (actor === owner) {
              core.setOutput('allowed', 'true');
              return;
            }

            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              const level = data.permission;
              const allowed = ['admin', 'maintain', 'write'].includes(level);
              core.setOutput('allowed', allowed ? 'true' : 'false');
              if (!allowed) {
                core.warning(`Actor "${actor}" has permission "${level}" — skipping CI.`);
              }
            } catch (e) {
              core.setOutput('allowed', 'false');
              core.warning(`Could not determine permissions for "${actor}": ${e.message}`);
            }

  lint:
    name: Lint (PHPCS + Rector + PHPStan)
    needs: check-actor
    if: needs.check-actor.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ffi, gmp
          coverage: none

      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer cs

      - name: Run Rector (dry-run)
        run: composer rector

      - name: Run PHPStan
        run: composer phpstan

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    needs: [check-actor, lint]
    if: needs.check-actor.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, gmp
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite=Unit --testdox

  e2e-tests:
    name: E2E Tests
    needs: [check-actor, lint]
    if: needs.check-actor.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start FoundationDB container
        run: |
          docker run -d --name fdb \
            -e FDB_NETWORKING_MODE=host \
            -p 4500:4500 \
            --entrypoint /usr/bin/tini \
            foundationdb/foundationdb:7.3.75 \
            -g -- /var/fdb/scripts/fdb_single.bash

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ffi, gmp
          coverage: none
          ini-values: ffi.enable=true

      - name: Install FoundationDB client library
        run: |
          wget -q "https://github.com/apple/foundationdb/releases/download/7.3.75/foundationdb-clients_7.3.75-1_amd64.deb" -O /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create cluster file
        run: echo "docker:docker@127.0.0.1:4500" > fdb.cluster

      - name: Wait for FDB to be ready
        run: |
          for i in $(seq 1 60); do
            if fdbcli -C fdb.cluster --exec "status minimal" 2>/dev/null | grep -q "healthy"; then
              echo "FDB is ready after ${i}s"
              exit 0
            fi
            echo "Waiting for FDB... ($i/60)"
            sleep 1
          done
          echo "FDB failed to become ready"
          docker logs fdb || true
          fdbcli -C fdb.cluster --exec "status" || true
          exit 1

      - name: Run E2E tests
        env:
          FDB_CLUSTER_FILE: fdb.cluster
        run: ./vendor/bin/phpunit --testsuite=Integration --testdox
